[project]
name = "gagauzium"
version = "1.0.4"
description = "Android application for learning Gagauz vocabulary"
requires-python = ">=3.12,<3.15"
dependencies = [
    "flet==0.86.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.flet]
product = "Gagauzium"
org = "com.flet"
bundle_id = "com.flet.gagauzium"
build_number = 6

[tool.flet.app]
path = "."
module = "main.py"
exclude = [
    ".env",
    ".env.example",
    ".flet",
    ".git",
    ".gitignore",
    ".pytest_cache",
    ".tmp",
    ".venv",
    "README.md",
    "__pycache__",
    "build",
    "design-reference",
    "docs",
    "imports",
    "pyproject.toml",
    "tests",
    "ubuntu-picture.jpg",
    "user_stats.json",
    "user_stats.json.tmp",
]

[tool.flet.android.signing]
key_alias = "androiddebugkey"
